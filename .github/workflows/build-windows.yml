name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "book_work_clock.py"
      - "manual_time.py"
      - "updater.py"
      - "requirements.txt"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install requirements and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q book_work_clock.py manual_time.py updater.py
      - name: Build self-contained Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BookWorkClock book_work_clock.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler "installer\BookWorkClock.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Publish downloadable installer and exe
        uses: actions/upload-artifact@v4
        with:
          name: BookWorkClock-Windows
          path: |
            dist/installer/BookWorkClock-Setup.exe
            dist/BookWorkClock.exe
          if-no-files-found: error

      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "dist/installer/BookWorkClock-Setup.exe" --title "${{ github.ref_name }}" --notes "Windows installer with bundled Python runtime." --verify-tag
