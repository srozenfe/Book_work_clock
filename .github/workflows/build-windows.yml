name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "book_work_clock.py"
      - "manual_time.py"
      - "updater.py"
      - "requirements.txt"
      - "installer/**"
      - ".github/workflows/build-windows.yml"

# A code push builds automatically. Only a new version number creates a release.
# Serialize builds to avoid publishing stale artifacts for the same version.
concurrency:
  group: book-work-clock-windows-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install requirements and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Compile Python sources
        run: python -m compileall -q book_work_clock.py manual_time.py updater.py
      - name: Build self-contained Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BookWorkClock book_work_clock.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found" }
          & $compiler "installer\BookWorkClock.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
      - name: Publish downloadable installer and exe
        uses: actions/upload-artifact@v4
        with:
          name: BookWorkClock-Windows
          path: |
            dist/installer/BookWorkClock-Setup.exe
            dist/BookWorkClock.exe
          if-no-files-found: error

      - name: Publish installer automatically for a new version
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = python -c "from updater import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          $issVersion = (Select-String -Path installer/BookWorkClock.iss -Pattern '^#define MyAppVersion "([^"]+)"').Matches.Groups[1].Value
          if ($issVersion -ne $version) { throw "Installer version ($issVersion) differs from app version ($version)" }
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Pushed tag does not match application version $tag"
          }
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; no new update to publish."
            exit 0
          }
          Write-Host "Publishing $tag from the verified Windows installer build"
          gh release create $tag "dist/installer/BookWorkClock-Setup.exe" --repo $env:GH_REPO --title $tag --notes "Windows installer with bundled Python runtime." --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "GitHub release publishing failed." }
